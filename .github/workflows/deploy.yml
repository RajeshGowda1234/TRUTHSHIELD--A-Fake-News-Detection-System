name: Deploy React App to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies and Build
        # If your React app is in a subdirectory called "truthshield-frontend", keep this as-is.
        # If your React files are directly in the root of the repo, remove the "cd truthshield-frontend &&" parts.
        run: |
          if [ -d "truthshield-frontend" ]; then cd truthshield-frontend; fi
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # If your React app is in a subdirectory, the path should be './truthshield-frontend/build'
          # If it's in the root, it should be './build'
          path: './truthshield-frontend/build' 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
